name: tests
on: [push, pull_request]
permissions:
  contents: read  # tests only read the code
jobs:
  test:
    runs-on: ubuntu-latest
    # official Python images, so old versions keep working when runners drop them
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends poppler-utils tesseract-ocr
      - run: python -m unittest -v
      - name: install as a command and run it
        run: |
          pip install .
          sourcetrace --version
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sourcetrace .
      - run: docker run --rm sourcetrace --version
