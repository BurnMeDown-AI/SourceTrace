name: tests
on: [push, pull_request]
permissions:
  contents: read  # tests only read the code
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y poppler-utils tesseract-ocr
      - run: python -m unittest -v
      - name: install as a command and run it
        run: |
          pip install .
          sourcetrace --version
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sourcetrace .
      - run: docker run --rm sourcetrace --version
