[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcetrace"
dynamic = ["version"]
description = "Follow a statistic back through its citations to where it actually came from."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["fact-checking", "fact-check", "citations", "statistics", "provenance", "misinformation",
            "source-verification", "osint", "ai-agents", "agent-skills"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Text Processing",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://burnmedown-ai.github.io/SourceTrace/"
Source = "https://github.com/BurnMeDown-AI/SourceTrace"
Issues = "https://github.com/BurnMeDown-AI/SourceTrace/issues"

[project.scripts]
sourcetrace = "sourcetrace:main"

[tool.setuptools]
py-modules = ["sourcetrace"]

[tool.setuptools.dynamic]
version = { attr = "sourcetrace.__version__" }
