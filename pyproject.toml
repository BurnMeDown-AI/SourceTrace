[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcetrace"
dynamic = ["version"]
description = "Follow a statistic back through its citations to where it actually came from."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["fact-checking", "citations", "statistics", "provenance", "misinformation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Text Processing",
]

[project.scripts]
sourcetrace = "sourcetrace:main"

[tool.setuptools]
py-modules = ["sourcetrace"]

[tool.setuptools.dynamic]
version = { attr = "sourcetrace.__version__" }
